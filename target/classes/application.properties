spring.application.name=replicador-documental
server.port=8080

# Async request timeout - Sin limite para procesamiento prolongado
spring.mvc.async.request-timeout=-1

# Servlet timeout - Sin  limite para conexiones persistentes
server.tomcat.connection-timeout=-1
server.tomcat.max-http-form-post-size=100MB
spring.datasource.url=jdbc:oracle:thin:@//192.168.21.222:1521/ACTIV
spring.datasource.username=DATA_AN
spring.datasource.password=Marzo.2024
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Optimización del pool de conexiones HikariCP para alta carga
spring.datasource.hikari.maximum-pool-size=200
spring.datasource.hikari.minimum-idle=30
spring.datasource.hikari.connection-timeout=45000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=ReplicadorHikariPool

# Enable HikariCP logging para monitoreo de conexiones
logging.level.com.zaxxer.hikari=DEBUG
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG
logging.level.com.zaxxer.hikari.pool.HikariPool=DEBUG

# JPA Configuration - Optimizado para procesamiento masivo
spring.jpa.open-in-view=false
# Hibernate detecta automáticamente el dialecto para Oracle
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect # Eliminado
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.connection.handling_mode=DELAYED_ACQUISITION_AND_RELEASE_AFTER_STATEMENT

# SOAP Client Configuration - Optimizado para alta concurrencia
soap.client.default-uri=https://activos.analitica.com.co/AZDigital/WebServices/SOAP/

# SOAP Implementation: manual, spring
soap.client.implementation=manual

# Timeouts SOAP (en milisegundos) - Aumentados para evitar fallos
soap.client.timeout.connection=60000
soap.client.timeout.socket=120000

# Pool de conexiones HTTP para SOAP
soap.client.pool.max-total=200
soap.client.pool.max-per-route=50

# Retry configuration - Aumentado para mayor resiliencia
soap.client.retry.max-attempts=5

# Enable retry annotation
spring.retry.enabled=true

# Cache configuration for SOAP responses
spring.cache.type=caffeine
spring.cache.cache-names=soap-responses
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=30m

# Batch SOAP processing - Reducido para menor carga
soap.client.batch.size=25
soap.client.batch.threads=10

# Document Registration Service
document.registration.api.url=https://back-manage-document-dbturhsfja-ue.a.run.app/api/manage-document/register
document.registration.api.token=sk_app_prueba_72K9xYpQrStUvWxZaBcDeFgHiJmNoPqR1234567890

# File Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.resolve-lazily=true

logging.level.org.springframework.ws.client.MessageTracing.sent=DEBUG
logging.level.org.springframework.ws.client.MessageTracing.received=DEBUG
logging.level.org.springframework.ws.soap.client=DEBUG
logging.level.org.springframework.ws=DEBUG

spring.cloud.gcp.project-id=go2cloud-activos-apps-dev
spring.cloud.gcp.bigquery.dataset-name=replicacion_acr
spring.cloud.gcp.bigquery.enabled=true

# Propiedades personalizadas para nuestro adaptador
bigquery.dataset.name=replicacion_acr
bigquery.table.name=migration_log


activos.gcp.pubsub.project-id=go2cloud-activos-apps-dev
